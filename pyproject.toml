# This is a file that will install dependencies etc.

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "labvision"
version = "1.0.0"
dependencies = [
"PyQt6>=6.0.0",
"sphinx>=4.0",
"sphinx-autobuild>=2021.3.14",
"sphinx-rtd-theme>=1.2.0",
"qimage2ndarray",
"moviepy >= 2.0",
"pywin32; sys_platform == 'win32'",
"qtwidgets @ git+https://github.com/MikeSmithLabTeam/qtwidgets@main",
"filehandling @ git+https://github.com/MikeSmithLabTeam/filehandling@main"
]

[tool.pytest.ini_options]
testpaths = ["tests"]


